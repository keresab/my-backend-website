<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { margin-bottom: 20px; color: #333; text-align: center; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-weight: bold; }
        input[type="text"], input[type="tel"], input[type="email"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #24b47e; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1f9d6d; }
        #statusMessage { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Register Contact Info</h2>
    <form id="contactForm">
        <div class="input-group">
            <label for="username">Full Name</label>
            <input type="text" id="username" required placeholder="John Doe">
        </div>
        <div class="input-group">
            <label for="userphone">Phone Number</label>
            <input type="tel" id="userphone" required placeholder="+123456789">
        </div>
        <div class="input-group">
            <label for="useremail">Email Address</label>
            <input type="email" id="useremail" required placeholder="john@example.com">
        </div>
        <button type="submit" id="submitBtn">Submit Info</button>
    </form>
    <div id="statusMessage"></div>
</div>

<script>
    // Your exact Supabase keys
    const SUPABASE_URL = "https://hfyvczbvicvzladudsoc.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_0JFl_gKwJ2DcSQGqSx8-tQ_nnEGYr-o";
    
    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('contactForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const statusMessage = document.getElementById('statusMessage');
        
        submitBtn.disabled = true;
        statusMessage.style.color = "orange";
        statusMessage.innerText = "Saving data... please wait.";

        const name = document.getElementById('username').value;
        const phone = document.getElementById('userphone').value;
        const email = document.getElementById('useremail').value;

        try {
            // This sends the text straight to your new contacts table
            const { error: dbError } = await supabase
                .from('contacts')
                .insert([{ name: name, phone: phone, email: email }]);

            if (dbError) throw dbError;

            statusMessage.style.color = "green";
            statusMessage.innerText = "Success! Contact info saved.";
            document.getElementById('contactForm').reset();

        } catch (error) {
            console.error(error);
            statusMessage.style.color = "red";
            statusMessage.innerText = "Error: " + error.message;
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
